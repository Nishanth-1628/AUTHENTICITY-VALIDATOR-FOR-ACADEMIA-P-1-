<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Authenticity Validator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page-content auth-shell">
  <div class="auth-card">
    <div class="glass-card">
      <div class="brand"><i class="fa-solid fa-shield-halved" style="color:var(--primary)"></i> Authenticity Validator</div>
      <p class="auth-sub">Log in to your dashboard</p>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@university.edu" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="flex justify-between items-center mb-2">
          <a href="forgot-password.html" class="small">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
      <p class="auth-footer small">Admin demo: admin@authvalidator.local / Admin@12345</p>
    </div>
  </div>
</div>

<script src="assets/js/background.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai-engine.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Logging in...";

    const { ok, data } = await Api.login({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });

    if (ok) {
      setToken(data.token);
      setUser(data.user);
      showToast("Welcome back, " + data.user.full_name);
      setTimeout(() => window.location.href = "dashboard.html", 500);
    } else {
      showToast(data.message || "Login failed", "error");
      btn.disabled = false; btn.textContent = "Login";
    }
  });
</script>
</body>
</html>
