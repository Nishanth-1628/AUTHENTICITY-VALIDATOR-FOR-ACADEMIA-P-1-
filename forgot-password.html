<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Authenticity Validator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page-content auth-shell">
  <div class="auth-card">
    <div class="glass-card" id="request-panel">
      <div class="brand"><i class="fa-solid fa-key" style="color:var(--primary)"></i> Reset Password</div>
      <p class="auth-sub">Enter your account email to continue</p>
      <form id="request-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <button class="btn btn-primary btn-block" id="request-btn">Continue</button>
      </form>
      <p class="auth-footer"><a href="login.html">Back to login</a></p>
    </div>

    <div class="glass-card hidden" id="reset-panel">
      <h3>Enter new password</h3>
      <div class="form-group"><label>New Password</label><input type="password" id="new_password"></div>
      <button class="btn btn-accent btn-block" id="reset-btn">Reset Password</button>
    </div>
  </div>
</div>

<script src="assets/js/background.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai-engine.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  let pendingEmail = "";
  document.getElementById("request-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    pendingEmail = document.getElementById("email").value.trim();
    const { ok, data } = await Api.forgotPassword({ email: pendingEmail });
    if (ok) {
      document.getElementById("request-panel").classList.add("hidden");
      document.getElementById("reset-panel").classList.remove("hidden");
    } else {
      showToast(data.message || "Something went wrong", "error");
    }
  });

  document.getElementById("reset-btn").addEventListener("click", async () => {
    const new_password = document.getElementById("new_password").value;
    const { ok, data } = await Api.resetPassword({ email: pendingEmail, new_password });
    if (ok) {
      showToast("Password reset! Redirecting to login...");
      setTimeout(() => window.location.href = "login.html", 800);
    } else {
      showToast(data.message || "Reset failed", "error");
    }
  });
</script>
</body>
</html>
