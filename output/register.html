<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Authenticity Validator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page-content auth-shell">
  <div class="auth-card" style="max-width:460px;">
    <div class="glass-card" id="register-panel">
      <div class="brand"><i class="fa-solid fa-shield-halved" style="color:var(--primary)"></i> Authenticity Validator</div>
      <p class="auth-sub">Create your account</p>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="full_name" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@university.edu" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="university">University</option>
          </select>
        </div>
        <div class="form-group">
          <label>University (optional)</label>
          <input type="text" id="university" placeholder="Your Institution">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
</div>

<script src="assets/js/background.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai-engine.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("register-btn");
    btn.disabled = true; btn.textContent = "Creating account...";

    const payload = {
      full_name: document.getElementById("full_name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      role: document.getElementById("role").value,
      university: document.getElementById("university").value.trim() || null,
    };

    const { ok, data } = await Api.register(payload);
    if (ok) {
      showToast("Account created! Redirecting to login...");
      setTimeout(() => window.location.href = "login.html", 800);
    } else {
      showToast(data.message || "Registration failed", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });
</script>
</body>
</html>
