<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — Authenticity Validator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page-content app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fa-solid fa-shield-halved" style="color:var(--primary)"></i> Auth Validator</div>
    <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="upload.html"><i class="fa-solid fa-upload"></i> Upload</a>
    <a href="history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
    <a href="reports.html"><i class="fa-solid fa-file-lines"></i> Reports</a>
    <div class="sidebar-section-label">Account</div>
    <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="#" onclick="logout()" style="color:var(--danger);margin-top:20px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <main class="main-panel">
    <div class="topbar">
      <div class="flex items-center gap-2">
        <button class="mobile-sidebar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <h2>Document History</h2>
      </div>
      <div class="user-chip" data-user-chip></div>
    </div>

    <div class="panel-body">
      <div class="glass-card">
        <div class="flex justify-between items-center gap-2 mb-3" style="flex-wrap:wrap;">
          <div class="flex gap-2" style="flex-wrap:wrap;">
            <input type="text" id="search-input" placeholder="Search filename..." style="width:220px;">
            <select id="status-filter" style="width:160px;">
              <option value="">All Statuses</option>
              <option value="verified">Verified</option>
              <option value="rejected">Rejected</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
            </select>
            <button class="btn btn-outline btn-sm" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-outline btn-sm" id="export-csv-btn"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
            <button class="btn btn-outline btn-sm" id="export-excel-btn"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>File</th><th>Type</th><th>Status</th><th>Score</th><th>Plagiarism</th><th>AI Content</th><th>Date</th><th>Report</th></tr></thead>
            <tbody id="history-body"><tr><td colspan="8" class="text-dim">Loading...</td></tr></tbody>
          </table>
        </div>

        <div class="flex justify-between items-center mt-3">
          <span class="text-dim small" id="page-info"></span>
          <div class="flex gap-2">
            <button class="btn btn-outline btn-sm" id="prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="btn btn-outline btn-sm" id="next-btn"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/background.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai-engine.js"></script>
<script src="assets/js/report.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  requireAuth();
  initNavbarUser();

  let currentPage = 1;
  let totalPages = 1;

  async function loadHistory() {
    const params = { page: currentPage, per_page: 10 };
    const search = document.getElementById("search-input").value.trim();
    const status = document.getElementById("status-filter").value;
    if (search) params.search = search;
    if (status) params.status = status;

    const { ok, data } = await Api.history(params);
    const tbody = document.getElementById("history-body");

    if (!ok || !data.documents.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-dim">No documents found.</td></tr>`;
      document.getElementById("page-info").textContent = "";
      return;
    }

    totalPages = data.pages;
    document.getElementById("page-info").textContent = `Page ${data.page} of ${data.pages} · ${data.total} total`;

    tbody.innerHTML = data.documents.map(d => `
      <tr>
        <td>${d.original_filename}</td>
        <td style="text-transform:uppercase;">${d.file_type}</td>
        <td>${statusBadge(d.status)}</td>
        <td>${d.authenticity_score ?? "-"}</td>
        <td>${d.plagiarism_percentage != null ? d.plagiarism_percentage + "%" : "-"}</td>
        <td>${d.ai_content_percentage != null ? d.ai_content_percentage + "%" : "-"}</td>
        <td class="text-dim small">${new Date(d.created_at).toLocaleDateString()}</td>
        <td><button class="btn btn-outline btn-sm" onclick="downloadReport('${d.id}')"><i class="fa-solid fa-download"></i></button></td>
      </tr>`).join("");
  }

  document.getElementById("search-btn").addEventListener("click", () => { currentPage = 1; loadHistory(); });
  document.getElementById("status-filter").addEventListener("change", () => { currentPage = 1; loadHistory(); });
  document.getElementById("prev-btn").addEventListener("click", () => { if (currentPage > 1) { currentPage--; loadHistory(); } });
  document.getElementById("next-btn").addEventListener("click", () => { if (currentPage < totalPages) { currentPage++; loadHistory(); } });

  document.getElementById("export-csv-btn").addEventListener("click", exportHistoryCsv);
  document.getElementById("export-excel-btn").addEventListener("click", exportHistoryExcel);

  loadHistory();
</script>
</body>
</html>
